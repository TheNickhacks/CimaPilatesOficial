services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cimapilates}
      POSTGRES_USER: ${POSTGRES_USER:-cimapilates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cimapilates}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://cimapilates:cimapilates@db:5432/cimapilates}
      DATABASE_SSL_REQUIRE: ${DATABASE_SSL_REQUIRE:-False}
      SITE_URL: ${SITE_URL:-http://localhost:8000}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data: